server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's built-in DNS. Looking the gateway up at request time (not at startup)
    # means nginx still starts and recovers if the gateway container restarts.
    resolver 127.0.0.11 valid=10s;

    # Everything under /api goes to the API gateway.
    # The browser only ever talks to this one origin, so there are no CORS problems.
    location /api/ {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
