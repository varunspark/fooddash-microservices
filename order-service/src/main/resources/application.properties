spring.application.name=order-service
server.port=8082

# Default database: in-memory H2. In Docker Compose these are overridden by environment variables.
spring.datasource.url=jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Where the restaurant service lives. Override with the RESTAURANT_SERVICE_URL environment variable.
restaurant-service.url=http://localhost:8081

fooddash.delivery-fee=30

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

server.error.include-message=always
