spring.application.name=restaurant-service
server.port=8081

# Default database: in-memory H2, so the service runs on its own with no setup.
# In Docker Compose these three are overridden by environment variables
# (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
spring.datasource.url=jdbc:h2:mem:restaurants;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Health endpoint used by Docker, load balancers and Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

server.error.include-message=always
fooddash.seed=true
